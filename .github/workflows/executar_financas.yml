name: Rodar Script de Finanças

on:
  schedule:
    # Roda todos os dias às 10:00 da manhã (Horário de Brasília)
    # Explicação: 10:00 BRT = 13:00 UTC
    - cron: '0 13 * * *'
  
  # Permite você clicar num botão "Run" para testar agora mesmo
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa seu código do repositório
      - name: Checkout do código
        uses: actions/checkout@v3

      # 2. Instala o Python
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' # Verifique se essa versão atende seu projeto

      # 3. Recria os arquivos sensíveis usando os Segredos
      - name: Restaurar arquivos de configuração
        env:
          MY_CREDENTIALS: ${{ secrets.CREDENTIALS_JSON }}
          MY_CONFIG: ${{ secrets.CONFIG_PY }}
        run: |
          echo "$MY_CREDENTIALS" > credentials.json
          echo "$MY_CONFIG" > config.py
          echo "Arquivos de configuração restaurados com sucesso!"

      # 4. Instala as bibliotecas (pandas, etc)
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 5. Roda o script principal
      - name: Executar main.py
        run: python main.py