name: Rodar Script de Finanças

on:
  schedule:
    - cron: '0 * * * *'
  
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Restaurar arquivos de configuração
        env:
          MY_CREDENTIALS: ${{ secrets.CREDENTIALS_JSON }}
          MY_CONFIG: ${{ secrets.CONFIG_PY }}
        run: |
          echo "$MY_CREDENTIALS" > credentials.json
          echo "$MY_CONFIG" > config.py
          echo "Arquivos de configuração restaurados com sucesso!"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar main.py
        run: python main.py
